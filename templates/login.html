<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
</head>
<body>
    <h1>تسجيل الدخول</h1>

    <hr>
    <h2>قسم المعلم (Admin)</h2>
    <form method="post" action="{% url 'teacher_login' %}">
        {% csrf_token %}
        <label>Teacher Code:</label>
        <input type="text" name="teacher_code" required>
        <button type="submit">دخول</button>
    </form>
    <br>
    <!-- الهايبرلينك المطلوب -->
    <a href="{% url 'teacher_register' %}">تسجيل معلم جديد</a>

    <hr>
    <h2>قسم الطالب (Student)</h2>
    <form method="post" action="{% url 'student_login' %}">
        {% csrf_token %}
        <label>Subject Code:</label>
        <input type="text" name="subject_code" required>
        <br>
        <label>Student Code:</label>
        <input type="text" name="student_code" required>
        <button type="submit">دخول</button>
    </form>
</body>
</html>
