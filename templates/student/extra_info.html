<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معلومات إضافية - {{ subject_name }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .fact-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; border-right: 4px solid #007bff; }
        h1 { color: #333; }
        .date { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>معلومات علمية موثوقة عن: {{ subject_name }}</h1>
    <p class="date">آخر تحديث: {{ today }}</p>
    
    {% for fact in facts %}
        <div class="fact-card">
            <p>{{ fact }}</p>
        </div>
    {% empty %}
        <p>لا توجد معلومات متاحة اليوم.</p>
    {% endfor %}
</body>
</html>
